<app-header class="full-width"></app-header>
<main id="content" class="js-content" role="main">
  <div class="govuk-grid-row">
    <div [class]="shouldShowMore ? 'govuk-grid-column-two-thirds' : 'govuk-grid-column-full'">
      <div class="back-link-wrapper">
        <a routerLink="/check-start" class="govuk-back-link aa-link-size">Back</a>
      </div>
      <header class="page-header">
        <h1 class="aa-title-size" tabindex="0">Practice questions</h1>
      </header>

      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <p class="govuk-body-l aa-copy-size" tabindex="0">There will be 3 practice questions.</p>
          <br />
          <button class="govuk-button govuk-button--start aa-button-size aa-contrast-button" role="button" id="start-now-button" (click)="onClick()">
            Start now
            <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg" width="17.5" height="19" viewBox="0 0 33 40" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div *ngIf="shouldShowMore" class="govuk-grid-column-one-third more-links aa-copy-size">
        <strong class='aa-contrast-border' speak="true" tabindex="0">More</strong>
        <ul>
            <li><a routerLink="/access-settings">Edit your settings</a></li>
        </ul>
    </div>
  </div>
</main>
