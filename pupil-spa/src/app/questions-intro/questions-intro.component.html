<app-header class="full-width"></app-header>
<main id="content" class="js-content" role="main">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full">
      <header class="page-header">
        <h1 class="aa-title-size" tabindex="0">Multiplication tables check questions</h1>
      </header>
      <p class="govuk-body-l aa-copy-size" tabindex="0">
        There will be {{count}} questions.
      </p>
      <div>
        <button type="button" class="govuk-button govuk-button--start aa-button-size aa-contrast-button" id="start-now-button" (click)="onClick()">
          Start now
          <svg class="govuk-button__start-icon" xmlns="http://www.w3.org/2000/svg" width="17.5" height="19" viewBox="0 0 33 40" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0h13l20 20-20 20H0l20-20z"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>
