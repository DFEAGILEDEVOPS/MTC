<!doctype html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>GOV.UK</title>
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/govuk-frontend/images/favicon.svg">
  <link rel="mask-icon" href="assets/govuk-frontend/images/govuk-icon-mask.svg" color="#1d70b8">
  <link rel="apple-touch-icon" href="assets/govuk-frontend/images/govuk-icon-180.png">
  <meta name="theme-color" content="#1d70b8" />
  <meta property="og:image" content="assets/govuk-frontend/images/govuk-opengraph-image.png">
  <meta name="build:number" content="#mtc.build#">
  <meta name="build:commitId" content="#mtc.commit#">
</head>
<body class="govuk-template__body">
  <script>document.body.className = ((document.body.className) ? document.body.className + ' js-enabled' : 'js-enabled');</script>
  <app-root></app-root>
  <div id="global-app-error" class="app-error hidden"></div>
  <script>
    // Disable Zoom out in Safari on iOS and macOS (reverse pinch)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    // Disable Zoom on Chrome, Opera and FF on the touchpad
    document.addEventListener('wheel', function (e) {
      if (e.ctrlKey === true) {
        e.preventDefault();
      }
    });
    // Disable Right-click context menu
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
  <script>
    window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
  </script>
  <noscript>
    <header>
      <h1>Please enable Javascript</h1>
    </header>
    <div class="govuk-inset-text">
      Javascript is disabled in your web browser. You will need to enable it to use the multiplication tables check.
    </div>
    <p class="top-padding">To solve this issue:</p>
    <ol class="govuk-list govuk-list--number">
      <li>Contact IT administrator in your school</li>
      <li>Contact STA service desk
        <p class="top-padding">
          Telephone:<br />
          <strong>0300 3033013</strong>
        </p>
      </li>
    </ol>
    <p>
      Opening times:<br />
      8:00am to 6:00pm, Monday to Friday
    </p>
  </noscript>
</body>
</html>
